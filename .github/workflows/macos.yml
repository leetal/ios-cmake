name: macos-jobs

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  build_with_16_4_MAC:
    name: "Xcode version 16.4, Target macOS [x86_64] Target SDK 13.3"
    runs-on: macos-15
    env:
      PLATFORM: MAC
      DEPLOYMENT_TARGET: 13.3
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      run: ./.github/build.sh
  build_with_latest_MAC:
    name: "Xcode version [latest supported], Target macOS [arm64] Target SDK 15.0 [shared example]"
    runs-on: macos-latest
    env:
      PLATFORM: MAC_ARM64
      DEPLOYMENT_TARGET: 15.0
      BUILD_SHARED: 1
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: ./.github/build.sh
