name: catalyst-jobs

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  build_with_16_4_MAC_CATALYST:
    name: "Xcode version 16.4, Target macOS Catalyst on Intel CPUs [x86_64] Target SDK 16.2"
    runs-on: macos-15
    env:
      PLATFORM: MAC_CATALYST
      DEPLOYMENT_TARGET: 16.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      run: ./.github/build.sh
  build_with_16_4_MAC_CATALYST_ARM64:
    name: "Xcode version 16.4, Target macOS Catalyst on Apple Silicon [arm64] Target SDK 17.2"
    runs-on: macos-15
    env:
      PLATFORM: MAC_CATALYST_ARM64
      DEPLOYMENT_TARGET: 17.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      run: ./.github/build.sh
  build_with_16_4_MAC_CATALYST_UNIVERSAL:
    name: "Xcode version 16.4, Target macOS Catalyst on Intel CPUs [x86_64] and Apple Silicon [arm64] Target SDK 17.2"
    runs-on: macos-15
    env:
      PLATFORM: MAC_CATALYST_UNIVERSAL
      DEPLOYMENT_TARGET: 17.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      run: ./.github/build.sh
  build_with_latest_MAC_CATALYST_UNIVERSAL:
    name: "Latest Xcode, Target macOS Catalyst on Intel CPUs [x86_64] and Apple Silicon [arm64] Target SDK 17.2"
    runs-on: macos-latest
    env:
      PLATFORM: MAC_CATALYST_UNIVERSAL
      DEPLOYMENT_TARGET: 17.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'
    - name: Build
      run: ./.github/build.sh
