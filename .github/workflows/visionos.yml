name: visionos-jobs

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize ]

jobs:
  build_with_16_4_VISIONOS:
    name: "Xcode version 16.4, Target visionOS [arm64] Target SDK 1.2"
    runs-on: macos-15
    env:
      PLATFORM: VISIONOS
      DEPLOYMENT_TARGET: 1.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'
    - name: Build
      continue-on-error: true
      run: ./.github/build.sh
  build_with_latest_SIMULATOR_VISIONOS:
    name: "Latest Xcode, Target visionOS Simulator [arm64] Target SDK 1.2"
    runs-on: macos-latest
    env:
      PLATFORM: SIMULATOR_VISIONOS
      DEPLOYMENT_TARGET: 1.2
    steps:
    - uses: actions/checkout@v4
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'
    - name: Build
      continue-on-error: true
      run: ./.github/build.sh
